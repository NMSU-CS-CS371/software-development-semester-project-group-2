" x2="7" y2="4" stroke="#3a3d42" stroke-width="2.5"/><line x1="13" y1="4" x2="20" y2="4" stroke="#3a3d42" stroke-width="2.5"/><text x="10" y="13" fill="#1a7f37" font-size="7" font-weight="700" text-anchor="middle">EXIT</text><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Doors</text></g><g transform="translate(4,180)"><rect x="0" y="0" width="20" height="14" fill="#d7dbe0" stroke="#d7dbe0" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Hallway</text></g><g transform="translate(4,204)"><line x1="0" y1="8" x2="20" y2="8" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M8,7 V5 A2,2 0 0 1 12,5 V7" fill="none" stroke="#7c3aed" stroke-width="1.2"/><rect x="7" y="7" width="6" height="5" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Staff only (no public access)</text></g><g transform="translate(4,228)"><circle cx="10" cy="7" r="6" fill="#ffffff" stroke="#e6e6ea" stroke-width="1.5"/><path d="M10,2 L12,7 L8,7 Z" fill="#8C0B42"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Compass</text></g><g transform="translate(4,252)"><rect x="0" y="0" width="20" height="14" fill="#ffffff" stroke="#3a3d42" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Outline</text></g></g>
