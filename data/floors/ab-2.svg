  <rect class="room" x="660" y="105" width="100" height="120"/><text class="lbl" x="710" y="165">211A</text>
  <rect class="room" x="765" y="105" width="105" height="120"/><text class="lbl" x="818" y="165">210</text>
  <rect class="room" x="355" y="335" width="190" height="135"/><text class="lbl" x="450" y="403">217</text>
  <rect class="room" x="440" y="280" width="105" height="50"/><text class="lblS" x="493" y="305">218A</text>
