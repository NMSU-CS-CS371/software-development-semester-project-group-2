<svg xmlns="http://www.w3.org/2000/svg" viewBox="-656 -52 1652 1017" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Goddard Hall (bldg 10) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="605,0 605,180 430,180 430,380 695,380 695,665 430,665 430,705 405,705 405,915 285,915 285,705 260,705 260,665 5,665 5,0"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="370" y="80" width="90" height="90"/>
  <rect class="hall" x="370" y="170" width="50" height="235"/>
  <rect class="hall" x="145" y="405" width="45" height="170"/>
  <rect class="hall" x="194" y="375" width="66" height="30"/>
  <rect class="hall" x="190" y="405" width="250" height="50"/>
  <rect class="hall" x="305" y="455" width="135" height="105"/>
  <rect class="hall" x="305" y="560" width="70" height="55"/>
  <rect class="hall" x="280" y="660" width="130" height="40"/>
  <rect class="hall" x="340" y="610" width="35" height="45"/>
  <text class="hall-lbl" transform="rotate(-90 393 318)" x="393" y="318">Hallway</text>
  <text class="hall-lbl" x="343" y="678">Hallway</text>

  <!-- ROOMS -->
  <rect class="room" x="440" y="400" width="250" height="260"/><text class="lbl" x="565" y="530">200</text>
  <rect class="core" x="370" y="5" width="90" height="75"/>
  <g class="icon" transform="translate(393,20) scale(1.875)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>
  <rect class="room" x="195" y="485" width="105" height="90"/><text class="lbl" x="248" y="530">R200B</text>
  <rect class="room" x="145" y="580" width="155" height="70"/><text class="lbl" x="223" y="615">R200A</text>
  <rect class="room" x="10" y="485" width="70" height="55"/><text class="lblS" x="45" y="513">202B</text>
  <polygon class="room" points="80,540 80,490 140,490 140,650 10,650 10,540"/><text class="lbl" x="81" y="581">202A</text>
  <rect class="room" x="10" y="5" width="180" height="170"/><text class="lbl" x="100" y="90">202D</text>
  <rect class="room" x="195" y="40" width="80" height="135"/><text class="lbl" x="235" y="108">202E</text>
  <rect class="room" x="10" y="175" width="135" height="310"/><text class="lbl" x="78" y="330">202C</text>
  <rect class="room" x="145" y="175" width="130" height="200"/><text class="lbl" x="210" y="275">202</text>

  <rect class="core" x="295" y="700" width="100" height="210"/>
  <g class="stair"><line x1="295" y1="709" x2="395" y2="709"/><line x1="295" y1="727" x2="395" y2="727"/><line x1="295" y1="745" x2="395" y2="745"/><line x1="295" y1="763" x2="395" y2="763"/><line x1="295" y1="781" x2="395" y2="781"/><line x1="295" y1="799" x2="395" y2="799"/><line x1="295" y1="817" x2="395" y2="817"/><line x1="295" y1="835" x2="395" y2="835"/><line x1="295" y1="853" x2="395" y2="853"/><line x1="295" y1="871" x2="395" y2="871"/><line x1="295" y1="889" x2="395" y2="889"/><line x1="295" y1="907" x2="395" y2="907"/></g>
  <rect class="core" x="305" y="615" width="35" height="40"/>
  <g class="stair"><line x1="305" y1="624" x2="340" y2="624"/><line x1="305" y1="642" x2="340" y2="642"/></g>
  <rect class="core" x="375" y="560" width="35" height="95"/>
  <g class="stair"><line x1="375" y1="569" x2="410" y2="569"/><line x1="375" y1="587" x2="410" y2="587"/><line x1="375" y1="605" x2="410" y2="605"/><line x1="375" y1="623" x2="410" y2="623"/><line x1="375" y1="641" x2="410" y2="641"/></g>
  <rect class="core" x="460" y="5" width="140" height="165"/>
  <g class="stair"><line x1="460" y1="14" x2="600" y2="14"/><line x1="460" y1="32" x2="600" y2="32"/><line x1="460" y1="50" x2="600" y2="50"/><line x1="460" y1="68" x2="600" y2="68"/><line x1="460" y1="86" x2="600" y2="86"/><line x1="460" y1="104" x2="600" y2="104"/><line x1="460" y1="122" x2="600" y2="122"/><line x1="460" y1="140" x2="600" y2="140"/><line x1="460" y1="158" x2="600" y2="158"/></g>
  <polygon class="floor-edge" points="605,0 605,180 430,180 430,380 695,380 695,665 430,665 430,705 405,705 405,915 285,915 285,705 260,705 260,665 5,665 5,0"/>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(867,762) rotate(305)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
  <g class="legend" transform="translate(-609,3) scale(3.15)"><rect x="0" y="0" width="190" height="280" fill="#ffffff" fill-opacity="0.92" stroke="#c7cad0" stroke-width="1"/><g transform="translate(4,12)"><rect x="0" y="0" width="20" height="14" fill="#eef1f4" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Room</text></g><g transform="translate(4,36)"><rect x="0" y="0" width="20" height="14" fill="#cfe0ff" stroke="#2f6feb" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Selected room</text></g><g transform="translate(4,60)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Core</text></g><g transform="translate(4,84)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><g class="icon" transform="translate(4,1) scale(0.496)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Elevator</text></g><g transform="translate(4,108)"><rect x="0" y="0" width="20" height="14" fill="#f7f7f8" stroke="#b5bac0" stroke-width="1.5" stroke-dasharray="3 2"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Void (open to below)</text></g><g transform="translate(4,132)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="4" x2="17" y2="4" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="7" x2="17" y2="7" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="10" x2="17" y2="10" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Stairs</text></g><g transform="translate(4,156)"><line x1="0" y1="4" x2="7" y2="4" stroke="#3a3d42" stroke-width="2.5"/><line x1="13" y1="4" x2="20" y2="4" stroke="#3a3d42" stroke-width="2.5"/><text x="10" y="13" fill="#1a7f37" font-size="7" font-weight="700" text-anchor="middle">EXIT</text><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Doors</text></g><g transform="translate(4,180)"><rect x="0" y="0" width="20" height="14" fill="#d7dbe0" stroke="#d7dbe0" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Hallway</text></g><g transform="translate(4,204)"><line x1="0" y1="8" x2="20" y2="8" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M8,7 V5 A2,2 0 0 1 12,5 V7" fill="none" stroke="#7c3aed" stroke-width="1.2"/><rect x="7" y="7" width="6" height="5" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Staff only (no public access)</text></g><g transform="translate(4,228)"><circle cx="10" cy="7" r="6" fill="#ffffff" stroke="#e6e6ea" stroke-width="1.5"/><path d="M10,2 L12,7 L8,7 Z" fill="#8C0B42"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Compass</text></g><g transform="translate(4,252)"><rect x="0" y="0" width="20" height="14" fill="#ffffff" stroke="#3a3d42" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Outline</text></g></g>
</svg>
