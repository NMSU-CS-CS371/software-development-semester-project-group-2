  <rect class="core" x="385" y="550" width="100" height="55"/>
  <g class="stair"><line x1="385" y1="559" x2="485" y2="559"/><line x1="385" y1="577" x2="485" y2="577"/><line x1="385" y1="595" x2="485" y2="595"/></g>
  <polygon class="floor-edge" points="25,60 30,550 385,550 830,550 830,60"/>
  <line class="door" x1="805" y1="60" x2="760" y2="60"/><text class="exit" x="783" y="125">EXIT</text>
  <g class="door-swing" fill="none" stroke="#3a3d42" stroke-width="3" stroke-linecap="round"><line x1="805" y1="60" x2="805" y2="105"/><path d="M805,105 A45,45 0 0 1 760,60" stroke-width="2"/></g>
  <line class="door" x1="27" y1="260" x2="27" y2="300"/><text class="exit" x="87" y="280">EXIT</text>
  <g class="door-swing" fill="none" stroke="#3a3d42" stroke-width="3" stroke-linecap="round"><line x1="27" y1="260" x2="67" y2="260"/><path d="M67,260 A40,40 0 0 1 27,300" stroke-width="2"/></g>
  <line class="door" x1="420" y1="550" x2="460" y2="550"/><text class="exit" x="440" y="490">EXIT</text>
  <g class="door-swing" fill="none" stroke="#3a3d42" stroke-width="3" stroke-linecap="round"><line x1="420" y1="550" x2="420" y2="510"/><path d="M420,510 A40,40 0 0 1 460,550" stroke-width="2"/></g>
