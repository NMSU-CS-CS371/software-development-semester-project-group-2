  <rect class="room" x="325" y="60" width="215" height="95"/><text class="lbl" x="433" y="108">111A</text>
  <rect class="room" x="376" y="337" width="41" height="83"/><text class="lblS" x="397" y="379">112</text>
  <rect class="room" x="320" y="379" width="56" height="41"/><text class="lblS" x="348" y="400">103A</text>
  <rect class="room" x="720" y="245" width="40" height="55"/><text class="lblS" x="740" y="273">109B</text>
  <rect class="room" x="760" y="245" width="70" height="55"/><text class="lblS" x="795" y="273">109A</text>
  <rect class="room" x="30" y="300" width="127" height="250"/><text class="lbl" x="94" y="425">114</text>
  <polygon class="room" points="110,175 120,175 120,260 25,260 25,60 110,60"/><text class="lbl" x="70" y="163">110</text>
  <polygon class="room" points="230,420 400,420 400,460 293,460 295,550 230,547 230,455"/><text class="lbl" x="291" y="469">103</text>
  <polygon class="room" points="110,60 325,60 325,155 460,155 460,260 120,260 120,175 110,175"/><text class="lbl" x="263" y="171">105</text>
  <polygon class="room" points="460,305 460,157 540,155 540,60 720,60 720,405 680,405 680,260 560,260 560,305"/><text class="lbl" x="608" y="196">104</text>
