<svg xmlns="http://www.w3.org/2000/svg" viewBox="74 -103 2056 1039" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Hadley Hall (bldg 172) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1620,870 1465,870 1465,855 295,855 295,875 135,875 135,105 290,105 290,180 985,180 985,70 1160,70 1160,180 1465,180 1465,105 1620,105"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="835" y="305" width="220" height="35"/>
  <rect class="hall" x="835" y="180" width="140" height="125"/>
  <text class="hall-lbl" x="918" y="268">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1620,855 1395,855 1395,735 1300,735 1300,465 1620,465"/><text class="lbl" x="1469" y="629">222</text>
  <rect class="room" x="1055" y="615" width="245" height="240"/><text class="lbl" x="1178" y="735">221</text>
  <polygon class="room" points="1055,855 760,855 760,630 840,550 1055,550"/><text class="lbl" x="915" y="706">216</text>
  <polygon class="room" points="535,855 535,755 575,755 575,575 695,575 760,630 760,855"/><text class="lbl" x="655" y="701">215</text>
  <rect class="room" x="410" y="755" width="125" height="100"/><text class="lbl" x="473" y="805">214B</text>
  <rect class="room" x="410" y="660" width="125" height="95"/><text class="lbl" x="473" y="708">214A</text>
  <rect class="room" x="410" y="575" width="125" height="85"/><text class="lbl" x="473" y="618">213</text>
  <rect class="room" x="135" y="180" width="275" height="675"/><text class="lbl" x="273" y="518">214</text>
  <polygon class="room" points="1300,615 1055,615 1055,415 1160,415 1160,335 1390,335 1390,465 1300,465"/><text class="lbl" x="1177" y="503">220</text>
  <rect class="room" x="840" y="340" width="215" height="210"/><text class="lbl" x="948" y="445">200</text>
  <polygon class="room" points="840,550 760,630 695,575 410,575 410,340 840,340"/><text class="lbl" x="680" y="465">210</text>
  <rect class="room" x="1390" y="180" width="230" height="285"/><text class="lbl" x="1505" y="323">223</text>
  <rect class="room" x="1305" y="180" width="85" height="155"/><text class="lbl" x="1348" y="258">201D</text>
  <rect class="room" x="1160" y="280" width="145" height="55"/><text class="lblS" x="1233" y="308">201A</text>
  <rect class="room" x="1220" y="180" width="85" height="100"/><text class="lbl" x="1263" y="230">201C</text>
  <rect class="room" x="1160" y="180" width="60" height="100"/><text class="lblS" x="1190" y="230">201B</text>
  <polygon class="room" points="1160,415 1055,415 1055,305 970,305 970,180 1160,180"/><text class="lbl" x="1053" y="252">201</text>
  <rect class="room" x="410" y="180" width="109" height="160"/><text class="lbl" x="465" y="260">210A</text>
  <rect class="core" x="985" y="70" width="175" height="110"/>
  <g class="icon" transform="translate(1040,92) scale(2.75)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>

  <rect class="core" x="519" y="180" width="316" height="160"/>
  <g class="stair"><line x1="528" y1="180" x2="528" y2="340"/><line x1="546" y1="180" x2="546" y2="340"/><line x1="564" y1="180" x2="564" y2="340"/><line x1="582" y1="180" x2="582" y2="340"/><line x1="600" y1="180" x2="600" y2="340"/><line x1="618" y1="180" x2="618" y2="340"/><line x1="636" y1="180" x2="636" y2="340"/><line x1="654" y1="180" x2="654" y2="340"/><line x1="672" y1="180" x2="672" y2="340"/><line x1="690" y1="180" x2="690" y2="340"/><line x1="708" y1="180" x2="708" y2="340"/><line x1="726" y1="180" x2="726" y2="340"/><line x1="744" y1="180" x2="744" y2="340"/><line x1="762" y1="180" x2="762" y2="340"/><line x1="780" y1="180" x2="780" y2="340"/><line x1="798" y1="180" x2="798" y2="340"/><line x1="816" y1="180" x2="816" y2="340"/><line x1="834" y1="180" x2="834" y2="340"/></g>
  <text class="lbl" x="677" y="320">ST1</text>
  <polygon class="floor-edge" points="1620,870 1465,870 1465,855 295,855 295,875 135,875 135,105 290,105 290,180 985,180 985,70 1160,70 1160,180 1465,180 1465,105 1620,105"/>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1327,37) rotate(13)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
  <g class="legend" transform="translate(1635,196) scale(2.3)"><rect x="0" y="0" width="190" height="280" fill="#ffffff" fill-opacity="0.92" stroke="#c7cad0" stroke-width="1"/><g transform="translate(4,12)"><rect x="0" y="0" width="20" height="14" fill="#eef1f4" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Room</text></g><g transform="translate(4,36)"><rect x="0" y="0" width="20" height="14" fill="#cfe0ff" stroke="#2f6feb" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Selected room</text></g><g transform="translate(4,60)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Core</text></g><g transform="translate(4,84)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><g class="icon" transform="translate(4,1) scale(0.496)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Elevator</text></g><g transform="translate(4,108)"><rect x="0" y="0" width="20" height="14" fill="#f7f7f8" stroke="#b5bac0" stroke-width="1.5" stroke-dasharray="3 2"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Void (open to below)</text></g><g transform="translate(4,132)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="4" x2="17" y2="4" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="7" x2="17" y2="7" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="10" x2="17" y2="10" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Stairs</text></g><g transform="translate(4,156)"><line x1="0" y1="4" x2="7" y2="4" stroke="#3a3d42" stroke-width="2.5"/><line x1="13" y1="4" x2="20" y2="4" stroke="#3a3d42" stroke-width="2.5"/><text x="10" y="13" fill="#1a7f37" font-size="7" font-weight="700" text-anchor="middle">EXIT</text><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Doors</text></g><g transform="translate(4,180)"><rect x="0" y="0" width="20" height="14" fill="#d7dbe0" stroke="#d7dbe0" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Hallway</text></g><g transform="translate(4,204)"><line x1="0" y1="8" x2="20" y2="8" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M8,7 V5 A2,2 0 0 1 12,5 V7" fill="none" stroke="#7c3aed" stroke-width="1.2"/><rect x="7" y="7" width="6" height="5" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Staff only (no public access)</text></g><g transform="translate(4,228)"><circle cx="10" cy="7" r="6" fill="#ffffff" stroke="#e6e6ea" stroke-width="1.5"/><path d="M10,2 L12,7 L8,7 Z" fill="#8C0B42"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Compass</text></g><g transform="translate(4,252)"><rect x="0" y="0" width="20" height="14" fill="#ffffff" stroke="#3a3d42" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Outline</text></g></g>
</svg>
