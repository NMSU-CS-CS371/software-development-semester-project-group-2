<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1765 609" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Jett Hall (bldg 189) - FLOOR 0
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .big   { fill: #e6ecf5; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="25,15 10,575 155,580 155,610 1750,605 1755,10"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="20" y="253" width="1509" height="112"/>
  <text class="hall-lbl" x="775" y="309">Hallway</text>
  <rect class="hall" x="1530" y="200" width="75" height="165"/>

  <!-- ROOMS -->
  <rect class="room" x="215" y="15" width="225" height="235"/><text class="lbl" x="328" y="133">005</text>
  <rect class="room" x="440" y="15" width="200" height="235"/><text class="lbl" x="540" y="133">007</text>
  <rect class="room" x="640" y="15" width="195" height="235"/><text class="lbl" x="738" y="133">009</text>
  <rect class="room" x="835" y="15" width="170" height="235"/><text class="lbl" x="920" y="133">011</text>
  <rect class="room" x="1005" y="10" width="185" height="240"/><text class="lbl" x="1098" y="130">013</text>
  <rect class="room" x="1190" y="10" width="330" height="240"/><text class="lbl" x="1355" y="130">015</text>
  <rect class="room" x="165" y="365" width="310" height="240"/><text class="lbl" x="320" y="485">004</text>
  <rect class="room" x="475" y="365" width="330" height="235"/><text class="lbl" x="640" y="483">006</text>
  <rect class="room" x="805" y="365" width="310" height="235"/><text class="lbl" x="960" y="483">010</text>
  <rect class="room" x="1115" y="365" width="80" height="240"/><text class="lbl" x="1155" y="485">012</text>
  <rect class="room" x="1195" y="365" width="545" height="230"/><text class="lbl" x="1468" y="480">016</text>
  <rect class="room" x="1530" y="90" width="150" height="110"/><text class="lbl" x="1605" y="145">H017</text>
  <rect class="core" x="1595" y="10" width="70" height="80"/>
  <g class="icon" transform="translate(1613,33) scale(1.458)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>
  <rect class="core" x="20" y="15" width="190" height="240"/>
  <rect class="core" x="20" y="365" width="65" height="210"/>

  <rect class="core" x="1605" y="255" width="135" height="110"/>
  <g class="stair"><line x1="1605" y1="264" x2="1740" y2="264"/><line x1="1605" y1="282" x2="1740" y2="282"/><line x1="1605" y1="300" x2="1740" y2="300"/><line x1="1605" y1="318" x2="1740" y2="318"/><line x1="1605" y1="336" x2="1740" y2="336"/><line x1="1605" y1="354" x2="1740" y2="354"/></g>
  <rect class="core" x="85" y="365" width="75" height="210"/>
  <g class="stair"><line x1="85" y1="374" x2="160" y2="374"/><line x1="85" y1="392" x2="160" y2="392"/><line x1="85" y1="410" x2="160" y2="410"/><line x1="85" y1="428" x2="160" y2="428"/><line x1="85" y1="446" x2="160" y2="446"/><line x1="85" y1="464" x2="160" y2="464"/><line x1="85" y1="482" x2="160" y2="482"/><line x1="85" y1="500" x2="160" y2="500"/><line x1="85" y1="518" x2="160" y2="518"/><line x1="85" y1="536" x2="160" y2="536"/><line x1="85" y1="554" x2="160" y2="554"/><line x1="85" y1="572" x2="160" y2="572"/></g>
  <polygon class="floor-edge" points="25,15 10,575 155,580 155,610 1750,605 1755,10"/>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(172,727) rotate(205)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
