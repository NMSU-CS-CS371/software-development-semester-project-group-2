  <rect class="room" x="680" y="1050" width="190" height="125"/><text class="lbl" x="775" y="1113">109</text>
  <rect class="room" x="680" y="1175" width="190" height="125"/><text class="lbl" x="775" y="1238">110</text>
  <rect class="room" x="955" y="770" width="100" height="205"/><text class="lbl" x="1005" y="873">106</text>
  <rect class="room" x="955" y="975" width="100" height="200"/><text class="lbl" x="1005" y="1075">108</text>
  <rect class="room" x="870" y="1230" width="85" height="70"/><text class="lbl" x="913" y="1265">R110</text>
  <rect class="room" x="1045" y="1175" width="120" height="125"/><text class="lbl" x="1105" y="1238">T111</text>
  <polygon class="room" points="1055,885 1165,885 1165,855 1505,855 1505,905 1595,905 1595,1300 1165,1300 1165,1175 1055,1175"/><text class="lbl" x="1337" y="1075">114</text>
  <polygon class="room" points="1595,905 1675,905 1675,855 1865,855 1865,885 1925,885 1925,1175 1595,1175"/><text class="lbl" x="1763" y="1023">119</text>
