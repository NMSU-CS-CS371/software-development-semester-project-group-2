  <g class="stair"><line x1="1165" y1="264" x2="1200" y2="264"/><line x1="1165" y1="282" x2="1200" y2="282"/><line x1="1165" y1="300" x2="1200" y2="300"/><line x1="1165" y1="318" x2="1200" y2="318"/></g>
  <polygon class="floor-edge" points="455,250 1165,250 1165,55 1260,55 1260,5 2385,5 2385,760 1925,760 1925,1300 585,1300 585,1175 40,1175 40,770 285,770 285,575 455,575"/>
  <line class="door" x1="285" y1="600" x2="285" y2="725"/><text class="exit" x="285" y="718">EXIT</text>
  <line class="door" x1="905" y1="250" x2="940" y2="250"/><text class="exit" x="922" y="232">EXIT</text>
  <line class="door" x1="1070" y1="250" x2="1105" y2="250"/><text class="exit" x="1088" y="232">EXIT</text>
  <line class="door" x1="600" y1="1300" x2="675" y2="1300"/><text class="exit" x="638" y="1355">EXIT</text>
  <line class="door" x1="965" y1="1300" x2="1040" y2="1300"/><text class="exit" x="1003" y="1355">EXIT</text>
  <line class="door" x1="1925" y1="775" x2="1925" y2="850"/><text class="exit" x="1870" y="812">EXIT</text>
  <line class="door" x1="2385" y1="690" x2="2385" y2="755"/><text class="exit" x="2335" y="722">EXIT</text>
  <line class="door" x1="2385" y1="15" x2="2385" y2="55"/><text class="exit" x="2335" y="35">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(2304,1247) rotate(14)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
  <g class="legend" transform="translate(-50,-150) scale(2.37)"><rect x="0" y="0" width="190" height="280" fill="#ffffff" fill-opacity="0.92" stroke="#c7cad0" stroke-width="1"/><g transform="translate(4,12)"><rect x="0" y="0" width="20" height="14" fill="#eef1f4" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Room</text></g><g transform="translate(4,36)"><rect x="0" y="0" width="20" height="14" fill="#cfe0ff" stroke="#2f6feb" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Selected room</text></g><g transform="translate(4,60)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Core</text></g><g transform="translate(4,84)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><g class="icon" transform="translate(4,1) scale(0.496)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Elevator</text></g><g transform="translate(4,108)"><rect x="0" y="0" width="20" height="14" fill="#f7f7f8" stroke="#b5bac0" stroke-width="1.5" stroke-dasharray="3 2"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Void (open to below)</text></g><g transform="translate(4,132)"><rect x="0" y="0" width="20" height="14" fill="#dfe3e8" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="4" x2="17" y2="4" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="7" x2="17" y2="7" stroke="#8f959c" stroke-width="1.5"/><line x1="3" y1="10" x2="17" y2="10" stroke="#8f959c" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Stairs</text></g><g transform="translate(4,156)"><line x1="0" y1="4" x2="7" y2="4" stroke="#3a3d42" stroke-width="2.5"/><line x1="13" y1="4" x2="20" y2="4" stroke="#3a3d42" stroke-width="2.5"/><text x="10" y="13" fill="#1a7f37" font-size="7" font-weight="700" text-anchor="middle">EXIT</text><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Doors</text></g><g transform="translate(4,180)"><rect x="0" y="0" width="20" height="14" fill="#d7dbe0" stroke="#d7dbe0" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Hallway</text></g><g transform="translate(4,204)"><line x1="0" y1="8" x2="20" y2="8" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M8,7 V5 A2,2 0 0 1 12,5 V7" fill="none" stroke="#7c3aed" stroke-width="1.2"/><rect x="7" y="7" width="6" height="5" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Staff only (no public access)</text></g><g transform="translate(4,228)"><circle cx="10" cy="7" r="6" fill="#ffffff" stroke="#e6e6ea" stroke-width="1.5"/><path d="M10,2 L12,7 L8,7 Z" fill="#8C0B42"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Compass</text></g><g transform="translate(4,252)"><rect x="0" y="0" width="20" height="14" fill="#ffffff" stroke="#3a3d42" stroke-width="1.5"/><text x="28" y="11" font-size="11" fill="#1d1f23" font-family="sans-serif">Outline</text></g></g>
