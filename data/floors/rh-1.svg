<svg xmlns="http://www.w3.org/2000/svg" viewBox="-123 -223 2586 1663" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Rentfrow Hall (bldg 211) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="455,250 1165,250 1165,55 1260,55 1260,5 2385,5 2385,760 1925,760 1925,1300 585,1300 585,1175 40,1175 40,770 285,770 285,575 455,575"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="455" y="575" width="260" height="195"/>
  <rect class="hall" x="715" y="630" width="340" height="140"/>
  <rect class="hall" x="1055" y="630" width="110" height="130"/>
  <rect class="hall" x="975" y="370" width="80" height="260"/>
  <rect class="hall" x="585" y="770" width="95" height="530"/>
  <rect class="hall" x="870" y="770" width="85" height="460"/>
  <rect class="hall" x="1055" y="760" width="870" height="95"/>
  <rect class="hall" x="1055" y="855" width="110" height="30"/>
  <rect class="hall" x="1505" y="855" width="170" height="50"/>
  <rect class="hall" x="1865" y="855" width="60" height="30"/>
  <rect class="hall" x="955" y="1175" width="90" height="125"/>
  <text class="hall-lbl" x="808" y="698">Hallway</text>
  <text class="hall-lbl" x="1448" y="808">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 633 938)" x="633" y="938">Hallway</text>

  <!-- ROOMS -->
  <rect class="room" x="455" y="250" width="130" height="325"/><text class="lbl" x="520" y="413">R129</text>
  <rect class="room" x="585" y="250" width="130" height="325"/><text class="lbl" x="650" y="413">R130</text>
  <rect class="room" x="715" y="250" width="260" height="380"/><text class="lbl" x="845" y="440">100</text>
