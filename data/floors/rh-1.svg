  <polygon class="room" points="1165,250 1260,250 1260,630 1165,630 1165,330 1200,330 1200,255 1165,255"/><text class="lbl" x="1215" y="452">103B</text>
  <polygon class="room" points="1260,5 1925,5 1925,760 1165,760 1165,630 1260,630"/><text class="lbl" x="1583" y="390">103A</text>
  <rect class="room" x="1925" y="5" width="460" height="755"/><text class="lbl" x="2155" y="383">103</text>
  <rect class="room" x="285" y="575" width="170" height="195"/><text class="lbl" x="370" y="673">128</text>
  <rect class="room" x="40" y="770" width="545" height="405"/><text class="lbl" x="313" y="973">127</text>
