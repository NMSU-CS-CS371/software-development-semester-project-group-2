<!doctype html>
<!--
  This file & what it does: lays out the screen. That is the top bar, the map, and the building info box.
  Why we have it: the browser needs one HTML page to start from. Words and numbers stay in config.yml
  and the data files so this file does not change every time a building name does.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- phone address bar color. JS updates this from config.yml -->
  <meta name="theme-color" content="#8C0B42" />
  <title>Better NMSU Maps</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- connect early so the libraries and map tiles load faster -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <!-- start these downloads now so they happen at the same time -->
  <link rel="modulepreload" href="js/main.js" />
  <link rel="preload" href="config.yml" as="fetch" crossorigin />
  <link rel="preload" href="data/buildings.geojson" as="fetch" crossorigin />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <!-- our css. baseStyle.css has to come first -->
  <link rel="stylesheet" href="styles/baseStyle.css" />
  <link rel="stylesheet" href="styles/mapStyle.css" />
  <link rel="stylesheet" href="styles/sheetStyle.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons@5.0.5/css/framework7-icons.min.css" />
  <link rel="stylesheet" href="styles/actionPill.css" />
  <link rel="stylesheet" href="styles/menuStyle.css" />
  <link rel="stylesheet" href="styles/locationsStyle.css" />
  <link rel="stylesheet" href="styles/searchStyle.css" />

  <!-- libraries. defer lets the page show before these run -->
  <script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>

  <!-- top bar. the title text comes from config.yml -->
  <div class="navbar">
    <button id="menu-btn" class="nav-side" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-popup">
      <i class="icon f7-icons" aria-hidden="true">menu</i>
    </button>
    <span class="navbar-title" id="navbar-title"></span>
    <button id="search-btn" class="nav-side" type="button" aria-label="Search" aria-expanded="false" aria-controls="search-drop">
      <i class="icon f7-icons" aria-hidden="true">search</i>
    </button>
  </div>

  <!-- drops down under the bar. search.js fills the results once you type -->
  <div id="search-drop" class="search-drop" aria-hidden="true">
    <label class="search-field">
      <i class="icon f7-icons" aria-hidden="true">search</i>
      <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" />
      <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>
        <i class="icon f7-icons" aria-hidden="true">xmark_circle_fill</i>
      </button>
    </label>
    <div id="search-results" class="search-results" hidden><ul></ul></div>
  </div>

  <!-- full-screen menu. menu.js fills in the words and opens it -->
  <div id="menu-popup" class="menu-popup" aria-hidden="true">
    <button id="menu-close" class="menu-close" type="button" aria-label="Close">&times;</button>
    <div class="menu-inner">
      <a href="#" id="menu-map" class="menu-link" style="--i: 0"></a>
      <a href="#" id="menu-locations" class="menu-link" style="--i: 1"></a>
    </div>
  </div>

  <!-- locations page. locations.js fills the list the first time it opens -->
  <div id="locations-popup" class="locations-popup" aria-hidden="true">
    <div class="locations-bar">
      <span class="nav-side" aria-hidden="true"></span>
      <span class="navbar-title" id="locations-title"></span>
      <button id="locations-close" class="nav-side" type="button" aria-label="Close">
        <i class="icon f7-icons" aria-hidden="true">xmark</i>
      </button>
    </div>
    <div id="places-list" class="locations-body"></div>
  </div>

  <!-- the map goes in this div -->
  <div id="map"></div>

  <!-- building info box. infoSheet.js fills in the text -->
  <div id="building-sheet" role="dialog" aria-label="Building information" aria-hidden="true">
    <div class="bs-head">
      <!-- shown only when this building was opened from Locations -->
      <button id="bs-back" class="bs-side" type="button" aria-label="Back">
        <i class="icon f7-icons" aria-hidden="true">chevron_left</i>
      </button>
      <span id="bs-name" class="bs-name"></span>
      <button id="bs-close" class="bs-side bs-x" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="bs-body">
      <!-- floor plan slot. drop data/floors/hjlc-1.svg in and it shows up here -->
      <section id="bs-plan" class="bs-plan" hidden>
        <h3 class="bs-h3">Floor plan</h3>
        <div id="bs-plan-slot"></div>
      </section>
      <section id="bs-photos" hidden>
        <h3 id="bs-photos-title" class="bs-h3"></h3>
        <div id="bs-photo-row" class="bs-photo-row"></div>
      </section>
      <h3 id="bs-about-title" class="bs-h3"></h3>
      <div id="bs-description" class="bs-description"></div>
      <div id="bs-links" class="bs-links"></div>
      <dl id="bs-facts" class="bs-facts"></dl>
      <a id="bs-link" class="bs-link" href="#" target="_blank" rel="noopener"></a>
      <p id="bs-source" class="bs-source"></p>
    </div>
  </div>

  <div id="pill-bar">
    <div id="map-settings">
      <div id="map-options"></div>
      <button id="map-settings-btn" class="pill pill--side f7-icons" type="button" aria-label="Map settings" aria-expanded="false">map</button>
    </div>
    <div id="pill-stack"></div>
    <button id="pill" class="pill pill--main" type="button">
      <span id="pill-label"></span>
      <span class="pill-chev" aria-hidden="true">⌃</span>
    </button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
