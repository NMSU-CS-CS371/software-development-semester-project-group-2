  arrivedCardText: "Arrived"
  turnLeftText: "Turn left"
  turnRightText: "Turn right"
  slightLeftText: "Slight left"
  slightRightText: "Slight right"
  continueText: "Continue"
  headText: "Head"
  onText: "on"
  compass: ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"]
  arriveText: "Arrive at"
  ontoText: "onto"
  minText: "min"
  arrivalTimeText: "arrive"
  slightTurnDegrees: 30
  turnDegrees: 60
  unnamedWays:
    footway: "the path"
    path: "the path"
    pedestrian: "the walkway"
    steps: "the steps"
    corridor: "the corridor"
    cycleway: "the path"
    service: "the service road"
    default: "the street"
  cardMaxWidth: "420px"
  cardLayer: 10000
  cardRadius: "20px"
  turnSize: "44px"
  turnRadius: "12px"
  turnIconSize: "24px"
  instructionSize: "16px"
  summarySize: "13px"
  walkIconSize: "18px"
  endIconSize: "14px"
  expandTime: "0.4s"
  stepsMaxHeight: "50vh"
  stepSize: "15px"
  stepIconSize: "20px"
  endTripTitle: "End trip?"
  endTripText: "Are you sure you want to end your trip?"
  endTripYes: "End trip"
  endTripNo: "Keep going"
  findingText: "Finding your location…"
  locationWaitMs: 5000
  locationTitle: "Location"
  locationAskText: "Can't find your location."
  locationOk: "OK"
  myLocationText: "My Location"
  changeStartLabel: "Change start"
  changeEndLabel: "Change destination"
  swapLabel: "Swap start and end"
  startDotColor: "#34c759"
  endDotColor: "#ffffff"
  askTitle: "Directions"
  askText: "Get directions to"
  askYes: "Go"
  askNo: "Not now"
  switchTitle: "Change destination?"
  switchFromText: "You're on your way to"
  switchToText: "Get directions to"
  switchYes: "Switch"
  switchNo: "Keep current"
  toText: "To"
  arrivedBackground: "rgba(52, 199, 89, 0.14)"
  arrivedColor: "#1d7a3a"
  indoorLineWidth: 10
  indoorArrowSize: 16
  indoorArrowSpacing: 44
  indoorStartRadius: 11
  startBuildingText: "Tap a building to start."
  endBuildingText: "Tap a building to go to."
  pickStartBanner: "Select a start"
  pickEndBanner: "Select a destination"
  pickCancel: "Cancel"
  startConfirmTitle: "Start"
  startFromText: "Start from"
  startConfirmYes: "Start"
  startConfirmNo: "Not now"
  endConfirmTitle: "Destination"
  endGoText: "Go to"
  endConfirmYes: "Go"
  endConfirmNo: "Not now"
  noLocationText: "Directions need your location. Allow location access for this site in your browser settings, then try again."
  tooFarText: "Directions work on the NMSU Las Cruces campus. Get closer to campus and try again."
  noRouteText: "No walking route was found to this building."
  loadFailedText: "Could not load the walking paths. Check your internet connection and try again."
  lineColor: "#0a84ff"
  lineOpacity: 0.35
  lineWidth: 10
  hopWidth: 4
  arrowColor: "#0a84ff"
  arrowSize: 18
  arrowSpacing: 24
  rerouteMetres: 8
  arrivalMetres: 5
  startCandidates: 6
  startSearchMetres: 40
  startSpacingMetres: 5
  maxDistanceToNetwork: 400
  searchRadius: 250
  roomColor: "rgba(10, 132, 255, 0.28)"
  roomEdge: "#0a84ff"
  roomEdgeWidth: 6

search: # the drop-down under the top bar
  placeholder: "Search buildings or rooms"
  maxResults: 8
  focusDelay: 60 # ms before the field is focused, so the slide can start first
  noMatchText: "No buildings or rooms match"
  roomText: "Room"
  storageKey: "bnm_search_text" # remembered on this device until it is cleared
  clearIconSize: "18px"
  panelShadowY: "8px"
  panelShadowBlur: "16px"
  slideTime: "0.24s"
  fadeTime: "0.18s"
  fieldHeight: "40px"
  fieldRadius: "12px"
  iconSize: "18px"
  inputSize: "16px" # 16px or more stops iPhone Safari zooming in
  focusRing: "rgba(255, 255, 255, 0.45)"
  resultsMaxHeight: "50vh"
  subtitleSize: "13px"
  nameSize: "17px"
  highlight: "rgba(140, 11, 66, 0.14)"
  emptySize: "15px"
  layer: 9 # under the top bar, so the panel slides out from behind it

pill:
  idleText: "Tap a building"
  infoText: "Info"
  floorText: "Floor"
  height: "39px"
  radius: "999px"
  fontSize: "14px"
  fontWeight: 700
  minWidth: "134px"
  bottomOffset: "48px"
  layer: 120
  floorGap: "8px"
  shadowY: "4px"
  shadowBlur: "16px"
  pressScale: 0.96
  pressTime: "0.12s"
  floorMoveTime: "0.32s"
  floorFadeTime: "0.2s"
  floorStagger: "0.04s"
  floorStartScale: 0.92
  disabledOpacity: 0.55

mapSettings: # the round button left of the pill
  icon: "map"
  closeIcon: "xmark"
  options: # top to bottom. the last row sits closest to the button
    tools: { label: "Map tools", icon: "line_horizontal_3_decrease" }
    names: { label: "Building names", icon: "textformat" }
    home: { label: "Home (Corbett Center)", icon: "house_fill" }
  rowHeight: "44px"
  iconCircle: "36px"
  iconSize: "20px"
  labelSize: "15px"

menu: # the full-screen menu (Map, Locations)
  mapText: "Map"
  locationsText: "Locations"
  background: "rgba(255, 255, 255, 0.97)"
  blur: "8px"
  fadeTime: "0.3s" # the white screen fades in and out
  closeSize: "32px"
  linkSize: "34px"
  linkSizeDesktop: "44px"
  linkWeight: 700
  linkRise: "12px" # each word starts this far below where it lands
  gap: "24px"
  gapDesktop: "32px"
  underlineOffset: "12px"
  underlineThickness: "3px"
  linkTime: "0.5s" # how long one word takes to fade and rise
  firstDelay: "0.05s"
  delayStep: "0.2s" # each word waits this much longer than the one above it
  layer: 220

locations: # the Locations page
  title: "Locations"
  pageBackground: "#f2f2f7" # iOS grouped-list grey; the rows sit on white
  iconSize: "20px"
  arrowSize: "15px"
  nameSize: "17px"
  subtitleSize: "13px"
  slideTime: "0.4s" # the page slides up over the map, then back down
  layer: 180
  rowHeight: "64px" # used only to size the scroll bar before a row is drawn

categories: # kinds of places on the map; the colours mean the same thing everywhere
  # Sprint 1 has only one kind. Housing, parks, food and parking come back in Sprint 2,
  # and each one only needs a line here plus buildings with that category.
  # icon is a Framework7 icon name, shown on the Locations page.
  study: { label: "Study", color: "#8C0B42", icon: "book_fill" } # NMSU crimson: classes and learning
